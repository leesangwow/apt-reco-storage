name: 실거래가 CSV 자동 수집

on:
  schedule:
    # 매주 월요일 오전 10시(KST = UTC+9) 실행
    - cron: '0 1 * * 1'
  # Actions 탭에서 수동 실행 가능
  workflow_dispatch:
    inputs:
      type:
        description: '수집 유형'
        required: true
        default: 'all'
        type: choice
        options: [all, buy, rent]

jobs:
  collect-and-load:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # CSV git push 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: Playwright Chromium 설치
        run: playwright install chromium --with-deps

      # ── 1단계: 웹사이트에서 CSV 다운로드 ───────────────────────────
      - name: CSV 다운로드
        run: |
          TYPE="${{ github.event.inputs.type || 'all' }}"
          python scripts/download_csv.py --type "$TYPE"

      # ── 2단계: Supabase 적재 ────────────────────────────────────────
      - name: Supabase 적재 (매매)
        if: ${{ github.event.inputs.type != 'rent' }}
        env:
          SUPABASE_DB_HOST:     ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT:     ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME:     ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER:     ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/load_csv.py --dir ./data/updates/buy

      - name: Supabase 적재 (전세)
        if: ${{ github.event.inputs.type != 'buy' }}
        env:
          SUPABASE_DB_HOST:     ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT:     ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME:     ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER:     ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/load_rent_csv.py --dir ./data/updates/rent

      # ── 3단계: CSV 파일을 git에 커밋 (기록 보관) ────────────────────
      - name: CSV git 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/updates/
          if git diff --staged --quiet; then
            echo "새로운 CSV 없음 — 커밋 생략"
          else
            MONTH=$(date +'%Y-%m')
            git commit -m "data: 실거래가 CSV 자동 수집 ${MONTH}"
            git push
          fi
