name: 실거래가 CSV 자동 수집

on:
  schedule:
    # 매주 월·목요일 오전 10시(KST = UTC+9) 실행
    # 주 2회인 이유: Supabase 무료 플랜은 미사용이 이어지면 프로젝트를 자동 일시정지한다.
    # 주 1회(7일 간격)면 정지 임계에 계속 걸쳐 적재 단계가 접속 실패로 죽는다.
    # 월→목(3일), 목→월(4일) 간격이면 DB가 깨어 있는 상태로 유지된다.
    - cron: '0 1 * * 1,4'
  # Actions 탭에서 수동 실행 가능
  workflow_dispatch:
    inputs:
      type:
        description: '수집 유형'
        required: true
        default: 'all'
        type: choice
        options: [all, buy, rent]

# 수집이 늦어져 다음 주 실행과 겹치면 DB에 동시 적재가 일어난다. 앞선 실행을 끝까지 기다린다.
concurrency:
  group: auto-collect
  cancel-in-progress: false

jobs:
  collect-and-load:
    runs-on: ubuntu-latest
    # 시도 16개 × 매매/전월세 = 32회 다운로드 + 적재. 경기도 전월세만 64MB다.
    timeout-minutes: 180
    permissions:
      contents: read

    env:
      COLLECT_TYPE: ${{ github.event.inputs.type || 'all' }}
      # 다운로드·적재 모두 ingestion_runs에 실행 이력을 남긴다 (관리자 페이지용).
      SUPABASE_DB_HOST:     ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT:     ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME:     ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER:     ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      # Chromium 바이너리(~150MB)는 매 실행 재다운로드할 이유가 없다.
      - name: Playwright 브라우저 캐시
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - name: Playwright Chromium 설치
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            playwright install-deps chromium   # 시스템 라이브러리만 (바이너리는 캐시 사용)
          else
            playwright install chromium --with-deps
          fi

      # ── 1단계: 웹사이트에서 CSV 다운로드 ───────────────────────────
      # --debug: 실패 시 원인 파악용 단계별 스크린샷 (아래 artifact로 업로드)
      - name: CSV 다운로드
        run: python scripts/download_csv.py --type "$COLLECT_TYPE" --debug

      - name: 실패 시 스크린샷 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: download-debug-screenshots
          path: debug_*.png
          retention-days: 7
          if-no-files-found: ignore

      # ── 2단계: Supabase 적재 ────────────────────────────────────────
      - name: Supabase 적재 (매매)
        if: env.COLLECT_TYPE != 'rent'
        run: python scripts/load_csv.py --dir ./data/updates/buy

      - name: Supabase 적재 (전월세)
        if: env.COLLECT_TYPE != 'buy'
        run: python scripts/load_rent_csv.py --dir ./data/updates/rent

      # ── 3단계: CSV 보관 ─────────────────────────────────────────────
      # git에 커밋하지 않는다. 16개 지역이면 회차당 약 300MB이고 주 2회 커밋하면
      # 저장소가 연 30GB 규모로 불어난다 (경기도 전월세 한 파일만 64MB).
      # DB 적재가 끝나면 CSV는 중간 산출물일 뿐이고 원본은 국토부 사이트에 있으므로,
      # 문제 추적에 필요한 기간만 artifact로 남긴다.
      - name: CSV artifact 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collected-csv
          path: data/updates/**/*.csv
          retention-days: 14
          compression-level: 9
          if-no-files-found: warn

      - name: 수집 요약
        if: always()
        run: |
          echo "### 수집 결과" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh data/updates/buy data/updates/rent 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          find data/updates -name '*.csv' | wc -l | xargs echo "CSV 파일 수:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
